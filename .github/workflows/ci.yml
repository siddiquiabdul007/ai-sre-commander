name: CI Pipeline & Production Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Lint & Multi-Agent Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Packages & Applications
        run: npm run build

      - name: Run Complete Test Suite (Unit, Chaos, Security, E2E Golden Incident)
        run: node --test tests/unit/*.test.js tests/security/*.test.js tests/chaos/*.test.js tests/e2e/*.test.js

      - name: Validate Terraform Configuration
        uses: hashicorp/setup-terraform@v3
      - run: |
          terraform -chdir=infrastructure/terraform init -backend=false
          terraform -chdir=infrastructure/terraform validate
